####################################################################
# Renders the top-languages card as a static SVG and commits it here.
#
# Replaces https://github-readme-stats.vercel.app/api/top-langs/, which
# returned 503 DEPLOYMENT_PAUSED and rendered as a broken image on the
# profile. Upstream's own readme calls the public instance "best-effort"
# and recommends this route. Nothing is fetched at page-view time now:
# GitHub serves a file out of this repo, so the card cannot 503.
####################################################################
name: Update the languages card

on:
  schedule:
    # Mondays 03:00 UTC (12:00 KST). Upstream caches top-langs for 6 days,
    # so anything more frequent would re-render identical output.
    - cron: "0 3 * * 1"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only on this repo, so the push at the
# end fails without this. Upstream's sample workflow omits it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate the card
        # Pinned to a full commit SHA, not a moving tag: this is a third-party
        # action and the tag it resolves to can be repointed at any time.
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: "username=freezpmark&theme=ayu-mirage&layout=compact&langs_count=10&size_weight=0.5&count_weight=0.5&exclude_repo=artificial-intelligence-algorithms,music-discord-bot"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to "false", which writes a "Something went wrong" card and
          # commits it. Fail loudly instead of publishing a broken card silently.
          fail_on_error: "true"

      - name: Commit the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          if git diff --staged --quiet; then
            echo "Card unchanged, nothing to commit."
          else
            git commit -m "Update the languages card"
            git push
          fi
